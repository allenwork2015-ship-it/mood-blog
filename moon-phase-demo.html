<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>臺北月相逐日演示</title><style>body{margin:0;background:#101827;color:#eee;font:16px system-ui,sans-serif;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:24px}p{color:#bac4d5;font-size:14px;line-height:1.7}#large{display:block;margin:auto;width:220px;height:220px}input{width:100%;margin:20px 0}button{background:#d6c9bc;color:#292524;padding:10px 16px;border:0;border-radius:20px;cursor:pointer;margin:5px}#days{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:8px;margin-top:20px}#days button{background:#1e293b;color:white;border:1px solid #475569;border-radius:12px;padding:8px}#days button[aria-pressed=true]{border-color:#fde68a;background:#334155}#days svg{width:64px;height:64px;display:block;margin:auto}#label{text-align:center;font-size:22px}</style><script src="./moon-phase.js?v=11"></script></head><body><main><h1>臺北月相逐日演示</h1><p id="today"></p><p>時區：Asia/Taipei（UTC+8）；參考地點：臺北。農曆日期依臺北時區換算，不要求定位。</p><div id="large"></div><div id="label"></div><input id="day" aria-label="農曆日期" type="range" min="1" max="29" value="6"><button id="play">逐日播放</button><button id="reset">回到今天</button><div id="days"></div><p>初一至十五亮面逐漸增加，之後逐漸減少。此為農曆日序的月相示意；實際朔望與亮面比例須天文計算，滿月可能在十五或十六。方向以北半球一般示意，不計觀測時刻造成的旋轉。</p><p><a style="color:#d6c9bc" href="https://www.hko.gov.hk/tc/gts/astron2026/almanac2026_index.htm">日期查核：香港天文台 2026 年曆</a></p></main><script>
const M=ShiguangMoon,slider=document.getElementById('day');let timer=null;const today=M.lunar(new Date());
document.getElementById('today').textContent=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',dateStyle:'full',timeStyle:'short'}).format(new Date())+'｜農曆 '+today.label;
function show(day){slider.value=day;const image=M.create(day,220);document.getElementById('large').replaceChildren(image);const percent=Number(image.dataset.illumination||0);document.getElementById('label').textContent='農曆 '+day+' 日・'+M.name(day)+'・示意亮面 '+percent+'%';document.querySelectorAll('#days button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i+1===day)));}
for(let d=1;d<=29;d++){const b=document.createElement('button'),c=M.create(d,64);b.append(c,document.createTextNode('農曆 '+d+' 日'));b.onclick=()=>{stop();show(d)};document.getElementById('days').append(b);}
function stop(){clearInterval(timer);timer=null;document.getElementById('play').textContent='逐日播放';}
slider.oninput=()=>{stop();show(Number(slider.value))};document.getElementById('reset').onclick=()=>{stop();show(Math.min(29,today.day))};document.getElementById('play').onclick=()=>{if(timer){stop();return}show(1);document.getElementById('play').textContent='暫停';timer=setInterval(()=>{const next=Number(slider.value)+1;if(next>29){stop();return}show(next)},650)};show(Math.min(29,today.day));
</script></body></html>
